<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real-Time Chat | Mukammal Versiya</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" />
  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
      min-height: 100vh;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .glass-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
    }
    .chat-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .chat-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }
  </style>
</head>
<body class="flex items-center justify-center p-3 md:p-6">

  <div class="w-full max-w-md glass-card rounded-3xl p-5 md:p-7 relative overflow-hidden flex flex-col min-h-[600px] max-h-[90vh]">
    
    <!-- HEADER -->
    <div class="flex items-center justify-between pb-4 border-b border-slate-800">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20">
          <i class="fa-solid fa-comments text-white text-lg"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-100 tracking-wide">Sohbat Chat</h1>
          <p id="roomInfoText" class="text-xs text-cyan-400 font-medium">Bosh sahifa</p>
        </div>
      </div>
      <button id="leaveBtn" onclick="leaveChat()" class="hidden text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-xl border border-red-500/20 transition-all">
        Chiqish
      </button>
    </div>

    <!-- NOTIFICATION ALERT -->
    <div id="alertBox" class="hidden mt-3 p-3 rounded-xl text-xs font-medium border flex items-center justify-between transition-all">
      <span id="alertMessage"></span>
      <button onclick="hideAlert()" class="ml-2 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
    </div>

    <!-- SCREEN 1: LOGIN & CHOICE -->
    <div id="authScreen" class="flex-1 flex flex-col justify-center space-y-5 my-auto">
      <div>
        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Ismingiz</label>
        <div class="relative">
          <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
          <input type="text" id="usernameInput" placeholder="Masalan: Ali" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl py-3.5 pl-11 pr-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-3 pt-2">
        <button onclick="openTab('create')" class="w-full py-4 px-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-semibold rounded-2xl shadow-lg shadow-cyan-500/25 transition-all text-xs sm:text-sm flex flex-col items-center justify-center space-y-2">
          <i class="fa-solid fa-plus-circle text-xl"></i>
          <span>Chat Yaratish</span>
        </button>
        <button onclick="openTab('join')" class="w-full py-4 px-3 bg-slate-800 hover:bg-slate-700/80 border border-slate-700/60 text-slate-200 font-semibold rounded-2xl transition-all text-xs sm:text-sm flex flex-col items-center justify-center space-y-2">
          <i class="fa-solid fa-right-to-bracket text-xl text-cyan-400"></i>
          <span>Chatga Kirish</span>
        </button>
      </div>
    </div>

    <!-- SCREEN 2: CREATE CHAT FORM -->
    <div id="createScreen" class="hidden flex-1 flex flex-col justify-center space-y-4 my-auto">
      <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wide text-center mb-2">Yangi Chat Yaratish</h2>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Xona Paroli</label>
        <input type="password" id="createPassword" placeholder="Parol kiriting" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all">
      </div>
      <div class="pt-2 flex space-x-3">
        <button onclick="backToAuth()" class="w-1/3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-semibold">Orqaga</button>
        <button onclick="createRoom()" class="w-2/3 py-3 bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold rounded-2xl shadow-lg shadow-cyan-500/20 text-xs">Yaratish</button>
      </div>
    </div>

    <!-- SCREEN 3: JOIN CHAT FORM -->
    <div id="joinScreen" class="hidden flex-1 flex flex-col justify-center space-y-4 my-auto">
      <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wide text-center mb-2">Mavjud Chatga Kirish</h2>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Xona Kodi</label>
        <input type="text" id="joinRoomId" placeholder="Masalan: 482910" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all font-mono tracking-widest">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-400 mb-1">Xona Paroli</label>
        <input type="password" id="joinPassword" placeholder="Parol" class="w-full bg-slate-900/80 border border-slate-700/60 rounded-2xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all">
      </div>
      <div class="pt-2 flex space-x-3">
        <button onclick="backToAuth()" class="w-1/3 py-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-2xl text-xs font-semibold">Orqaga</button>
        <button onclick="joinRoom()" class="w-2/3 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-2xl shadow-lg shadow-blue-600/20 text-xs">Kirish</button>
      </div>
    </div>

    <!-- SCREEN 4: CHAT ROOM INTERFACE -->
    <div id="chatScreen" class="hidden flex-1 flex flex-col mt-4 min-h-0">
      <!-- ROOM CODE DISPLAY BAR -->
      <div class="bg-slate-900/60 border border-slate-800 rounded-2xl p-3 mb-3 flex items-center justify-between">
        <div>
          <span class="text-[10px] text-slate-400 uppercase tracking-wider block">Xona kodi (ulashing):</span>
          <span id="displayRoomId" class="font-mono text-sm font-bold text-cyan-400">------</span>
        </div>
        <button onclick="copyRoomId()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-xl text-xs flex items-center space-x-1 border border-slate-700/50">
          <i class="fa-regular fa-copy"></i>
          <span>Nusxalash</span>
        </button>
      </div>

      <!-- MESSAGES AREA -->
      <div id="messagesList" class="flex-1 overflow-y-auto space-y-3 pr-1 chat-scroll my-2 flex flex-col">
        <!-- Dinamik xabarlar shu yerga tushadi -->
      </div>

      <!-- MESSAGE INPUT FORM -->
      <form onsubmit="sendMessage(event)" class="mt-2 flex items-center space-x-2">
        <input type="text" id="messageInput" placeholder="Xabar yozing..." autocomplete="off" class="flex-1 bg-slate-900/90 border border-slate-700/60 rounded-2xl py-3 px-4 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-cyan-500 transition-all">
        <button type="submit" class="w-11 h-11 bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-2xl flex items-center justify-center font-bold shadow-lg shadow-cyan-500/20 transition-all shrink-0">
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </div>

  </div>

  <!-- FIREBASE SDK & APP LOGIC -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc, 
      collection, 
      addDoc, 
      onSnapshot, 
      query, 
      orderBy, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Sizning Firebase konfiguratsiyangiz
    const firebaseConfig = {
      apiKey: "AIzaSyB4SqJS0ztxdUxRwOYx2NB5XiZTs-vsR6o",
      authDomain: "chatchi-e8290.firebaseapp.com",
      projectId: "chatchi-e8290",
      storageBucket: "chatchi-e8290.firebasestorage.app",
      messagingSenderId: "760473672419",
      appId: "1:760473672419:web:15dc850a3b97f1b79c03d6",
      measurementId: "G-5JZ9325HWW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentUser = "";
    let currentRoomId = "";
    let unsubscribeListener = null;

    // XABARLARNI CHIQARISH VA OGOHLANTIRISH
    window.showAlert = (msg, type = 'error') => {
      const box = document.getElementById('alertBox');
      const text = document.getElementById('alertMessage');
      box.className = `mt-3 p-3 rounded-xl text-xs font-medium border flex items-center justify-between transition-all ${
        type === 'error' ? 'bg-red-500/10 border-red-500/20 text-red-400' : 'bg-emerald-500/10 border-emerald-500/20 text-emerald-400'
      }`;
      text.innerText = msg;
      box.classList.remove('hidden');
    };

    window.hideAlert = () => {
      document.getElementById('alertBox').classList.add('hidden');
    };

    window.openTab = (tab) => {
      window.hideAlert();
      const user = document.getElementById('usernameInput').value.trim();
      if (!user) {
        window.showAlert("Iltimos, avval o'z ismingizni kiriting!");
        return;
      }
      currentUser = user;
      document.getElementById('authScreen').classList.add('hidden');
      if (tab === 'create') document.getElementById('createScreen').classList.remove('hidden');
      if (tab === 'join') document.getElementById('joinScreen').classList.remove('hidden');
    };

    window.backToAuth = () => {
      window.hideAlert();
      document.getElementById('createScreen').classList.add('hidden');
      document.getElementById('joinScreen').classList.add('hidden');
      document.getElementById('authScreen').classList.remove('hidden');
    };

    // CHAT XONA YARATISH
    window.createRoom = async () => {
      window.hideAlert();
      const pwd = document.getElementById('createPassword').value.trim();
      if (!pwd) {
        window.showAlert("Iltimos, xona uchun parol kiriting!");
        return;
      }

      const generatedCode = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        await setDoc(doc(db, "rooms", generatedCode), {
          password: pwd,
          createdAt: serverTimestamp(),
          createdBy: currentUser
        });

        currentRoomId = generatedCode;
        enterChatRoom();
      } catch (e) {
        window.showAlert("Xatolik yuz berdi: " + e.message);
      }
    };

    // MAVJUD CHATGA KIRISH
    window.joinRoom = async () => {
      window.hideAlert();
      const roomId = document.getElementById('joinRoomId').value.trim();
      const pwd = document.getElementById('joinPassword').value.trim();

      if (!roomId || !pwd) {
        window.showAlert("Xona kodi va parolini to'liq kiriting!");
        return;
      }

      try {
        const roomRef = doc(db, "rooms", roomId);
        const roomSnap = await getDoc(roomRef);

        if (!roomSnap.exists()) {
          window.showAlert("Bunday xona topilmadi!");
          return;
        }

        if (roomSnap.data().password !== pwd) {
          window.showAlert("Xona paroli noto'g'ri!");
          return;
        }

        currentRoomId = roomId;
        enterChatRoom();
      } catch (e) {
        window.showAlert("Kirishda xatolik: " + e.message);
      }
    };

    // CHATGA KIRIB XABarlarni REAL VAQTDA O'QISH
    function enterChatRoom() {
      document.getElementById('createScreen').classList.add('hidden');
      document.getElementById('joinScreen').classList.add('hidden');
      document.getElementById('chatScreen').classList.remove('hidden');
      document.getElementById('leaveBtn').classList.remove('hidden');

      document.getElementById('roomInfoText').innerText = `Xona: #${currentRoomId}`;
      document.getElementById('displayRoomId').innerText = currentRoomId;

      const q = query(
        collection(db, "rooms", currentRoomId, "messages"),
        orderBy("createdAt", "asc")
      );

      unsubscribeListener = onSnapshot(q, (snapshot) => {
        const messagesList = document.getElementById('messagesList');
        messagesList.innerHTML = "";

        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const isMe = data.sender === currentUser;

          const msgDiv = document.createElement('div');
          msgDiv.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'} my-1`;

          const content = `
            <span class="text-[10px] text-slate-400 px-1 mb-0.5">${escapeHtml(data.sender || 'Noma\'lum')}</span>
            <div class="max-w-[80%] rounded-2xl py-2 px-3.5 text-xs sm:text-sm ${
              isMe 
                ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-white rounded-br-none shadow-md shadow-cyan-500/10' 
                : 'bg-slate-800 text-slate-200 rounded-bl-none border border-slate-700/50'
            }">
              ${escapeHtml(data.text || '')}
            </div>
          `;
          msgDiv.innerHTML = content;
          messagesList.appendChild(msgDiv);
        });

        messagesList.scrollTop = messagesList.scrollHeight;
      }, (err) => {
        window.showAlert("Ulanish xatosi: " + err.message);
      });
    }

    // XABAR YUBORISH
    window.sendMessage = async (e) => {
      e.preventDefault();
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text || !currentRoomId) return;

      input.value = "";

      try {
        await addDoc(collection(db, "rooms", currentRoomId, "messages"), {
          text: text,
          sender: currentUser,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        window.showAlert("Xabar yuborilmadi: " + err.message);
      }
    };

    // CHATDAN CHIQISH
    window.leaveChat = () => {
      if (unsubscribeListener) unsubscribeListener();
      currentRoomId = "";
      document.getElementById('chatScreen').classList.add('hidden');
      document.getElementById('leaveBtn').classList.add('hidden');
      document.getElementById('roomInfoText').innerText = "Bosh sahifa";
      document.getElementById('authScreen').classList.remove('hidden');
    };

    // XONANI NUSXALASH
    window.copyRoomId = () => {
      navigator.clipboard.writeText(currentRoomId);
      window.showAlert("Xona kodi nusxalandi!", "success");
    };

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
